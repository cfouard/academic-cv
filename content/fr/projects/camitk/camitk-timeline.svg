<svg viewBox="0 0 1120 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Frise chronologique de l'adoption de CamiTK, de 2008 à aujourd'hui">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1b3a5b"/>
    </marker>
  </defs>

  <!-- Titre -->
  <text x="560" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1b3a5b">CamiTK — plus de 15 ans d'adoption</text>
  <text x="560" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Du logiciel de laboratoire à l'atelier de référence, toujours développé aujourd'hui</text>

  <!-- Ligne de temps -->
  <line x1="60" y1="165" x2="1075" y2="165" stroke="#1b3a5b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Jalon 1 : 2008 -->
  <text x="80" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1b3a5b">2008</text>
  <circle cx="80" cy="165" r="10" fill="#b89b3e" stroke="#1b3a5b" stroke-width="2.5"/>
  <text x="80" y="200" text-anchor="middle" font-size="12.5" fill="#374151">Démarrage</text>
  <text x="80" y="217" text-anchor="middle" font-size="12.5" fill="#374151">au TIMC (t₀)</text>

  <!-- Jalon 2 : 2011 -->
  <text x="245" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1b3a5b">2011</text>
  <circle cx="245" cy="165" r="10" fill="#b89b3e" stroke="#1b3a5b" stroke-width="2.5"/>
  <text x="245" y="200" text-anchor="middle" font-size="12.5" fill="#374151">Première diffusion</text>
  <text x="245" y="217" text-anchor="middle" font-size="12.5" fill="#374151">open source (v2.0)</text>

  <!-- Jalon 3 : 2012 -->
  <text x="410" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1b3a5b">2012</text>
  <circle cx="410" cy="165" r="10" fill="#b89b3e" stroke="#1b3a5b" stroke-width="2.5"/>
  <text x="410" y="200" text-anchor="middle" font-size="12.5" fill="#374151">Intégration à</text>
  <text x="410" y="217" text-anchor="middle" font-size="12.5" fill="#374151">Debian-med (v3.0)</text>

  <!-- Jalon 4 : 2013 -->
  <text x="575" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1b3a5b">2013</text>
  <circle cx="575" cy="165" r="10" fill="#b89b3e" stroke="#1b3a5b" stroke-width="2.5"/>
  <text x="575" y="200" text-anchor="middle" font-size="12.5" fill="#374151">Labex CAMI</text>
  <text x="575" y="217" text-anchor="middle" font-size="12.5" fill="#374151">(reconnaissance)</text>

  <!-- Jalon 5 : 2016 -->
  <text x="740" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1b3a5b">2016</text>
  <circle cx="740" cy="165" r="10" fill="#b89b3e" stroke="#1b3a5b" stroke-width="2.5"/>
  <text x="740" y="200" text-anchor="middle" font-size="12.5" fill="#374151">Support du</text>
  <text x="740" y="217" text-anchor="middle" font-size="12.5" fill="#374151">projet LPR (v4.0)</text>

  <!-- Jalon 6 : 2017 -->
  <text x="905" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1b3a5b">2017</text>
  <circle cx="905" cy="165" r="10" fill="#b89b3e" stroke="#1b3a5b" stroke-width="2.5"/>
  <text x="905" y="200" text-anchor="middle" font-size="12.5" fill="#374151">Institut Carnot</text>
  <text x="905" y="217" text-anchor="middle" font-size="12.5" fill="#374151">LSI</text>

  <!-- Jalon 7 : aujourd'hui (mis en valeur) -->
  <circle cx="1045" cy="165" r="18" fill="none" stroke="#1b3a5b" stroke-width="1.5" opacity="0.35"/>
  <text x="1045" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1b3a5b">Aujourd'hui</text>
  <circle cx="1045" cy="165" r="11" fill="#1b3a5b" stroke="#b89b3e" stroke-width="3"/>
  <text x="1045" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b3a5b">Toujours développé</text>
  <text x="1045" y="217" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b3a5b">(v6.0)</text>
</svg>
