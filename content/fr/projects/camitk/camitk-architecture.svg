<svg viewBox="0 0 1080 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Architecture modulaire de CamiTK : un cœur commun, des modules enfichables et une extension métier">

  <!-- ============ CONNECTEURS (sous les formes) ============ -->
  <!-- modules vers le cœur -->
  <line x1="450" y1="103" x2="519" y2="169" stroke="#1b3a5b" stroke-width="2.5"/>
  <line x1="655" y1="78"  x2="600" y2="135" stroke="#1b3a5b" stroke-width="2.5"/>
  <line x1="820" y1="143" x2="681" y2="169" stroke="#1b3a5b" stroke-width="2.5"/>
  <!-- extension vers le cœur (pointillés, comme le schéma d'origine) -->
  <path d="M320,255 L470,250" stroke="#1b3a5b" stroke-width="1.8" stroke-dasharray="3 4" fill="none"/>
  <path d="M320,345 L470,255" stroke="#1b3a5b" stroke-width="1.8" stroke-dasharray="3 4" fill="none"/>

  <!-- ============ CŒUR CamiTK ============ -->
  <circle cx="600" cy="250" r="115" fill="#f3d97a" stroke="#b89b3e" stroke-width="3.5"/>
  <text x="600" y="245" text-anchor="middle" font-size="30" font-weight="700" fill="#1b3a5b">CamiTK</text>
  <text x="600" y="275" text-anchor="middle" font-size="15" fill="#1b3a5b">C++ · Python</text>

  <!-- petit "plug" d'extension sur le bord gauche du cœur -->
  <rect x="470" y="234" width="32" height="32" rx="6" fill="#f3d97a" stroke="#b89b3e" stroke-width="2.5"/>

  <!-- ============ MODULES ENFICHABLES ============ -->
  <!-- Algorithmes (rose) -->
  <rect x="360" y="57" width="180" height="46" rx="23" fill="#f0c4dd" stroke="#d98cb8" stroke-width="2"/>
  <text x="450" y="86" text-anchor="middle" font-size="16" fill="#1b3a5b">Algorithmes</text>

  <!-- Visualisation et interaction (vert) -->
  <rect x="520" y="32" width="270" height="46" rx="23" fill="#c4e0b4" stroke="#8fbf6f" stroke-width="2"/>
  <text x="655" y="61" text-anchor="middle" font-size="16" fill="#1b3a5b">Visualisation et interaction</text>

  <!-- Données et E/S (bleu) -->
  <rect x="725" y="120" width="190" height="46" rx="23" fill="#bcd6ef" stroke="#7aa9d8" stroke-width="2"/>
  <text x="820" y="149" text-anchor="middle" font-size="16" fill="#1b3a5b">Données et E/S</text>

  <!-- ============ TAGLINE (à droite du cœur) ============ -->
  <text x="745" y="220" font-size="18" font-weight="700" fill="#1b3a5b">Plateforme modulaire</text>
  <text x="745" y="248" font-size="16" fill="#374151">Abstraction des données</text>
  <text x="745" y="274" font-size="16" fill="#374151">Interopérabilité</text>
  <text x="745" y="300" font-size="16" fill="#374151">Comportements par défaut</text>

  <!-- ============ EXTENSION MÉTIER (gauche) ============ -->
  <rect x="40" y="150" width="280" height="240" rx="14" fill="none" stroke="#5b4fa0" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="180" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#1b3a5b">Extension CamiTK</text>
  <text x="180" y="200" text-anchor="middle" font-size="13" fill="#374151">Couche d'interfaçage</text>

  <rect x="65" y="232" width="230" height="130" rx="55" fill="#f3d97a" stroke="#b89b3e" stroke-width="3"/>
  <text x="180" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#1b3a5b">Technologie</text>
  <text x="180" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#1b3a5b">de la discipline</text>
  <text x="180" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="#1b3a5b">spécifique</text>
</svg>
