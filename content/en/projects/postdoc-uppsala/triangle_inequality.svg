  <title
     id="title2">Violation de l'inégalité triangulaire par la distance euclidienne au carré</title>
  <desc
     id="desc4">Trois points p(0,0), o(2,1), q(3,0) sur une grille discrète. La distance euclidienne au carré viole l'inégalité triangulaire : d²E(p,q)=9 est supérieur à d²E(p,o)+d²E(o,q)=5+2=7.</desc>
  <defs
     id="defs11">
    <marker
       id="arrow"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M2 1L8 5L2 9"
         fill="none"
         stroke="context-stroke"
         stroke-width="1.5"
         stroke-linecap="round"
         stroke-linejoin="round"
         id="path6" />
    </marker>
    <style
       id="style9">
      text { font-family: Arial, Helvetica, sans-serif; }
      .t  { font-size: 14px; fill: #2C2C2A; }
      .ts { font-size: 12px; fill: #5F5E5A; }
      .th { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
    </style>
  </defs>
  <!-- Grille -->
  <g
     opacity="0.15"
     id="g33">
    <line
       x1="80"
       y1="60"
       x2="80"
       y2="290"
       stroke="#888780"
       stroke-width="0.5"
       id="line13" />
    <line
       x1="140"
       y1="60"
       x2="140"
       y2="290"
       stroke="#888780"
       stroke-width="0.5"
       id="line15" />
    <line
       x1="200"
       y1="60"
       x2="200"
       y2="290"
       stroke="#888780"
       stroke-width="0.5"
       id="line17" />
    <line
       x1="260"
       y1="60"
       x2="260"
       y2="290"
       stroke="#888780"
       stroke-width="0.5"
       id="line19" />
    <line
       x1="320"
       y1="60"
       x2="320"
       y2="290"
       stroke="#888780"
       stroke-width="0.5"
       id="line21" />
    <line
       x1="380"
       y1="60"
       x2="380"
       y2="290"
       stroke="#888780"
       stroke-width="0.5"
       id="line23" />
    <line
       x1="80"
       y1="80"
       x2="390"
       y2="80"
       stroke="#888780"
       stroke-width="0.5"
       id="line25" />
    <line
       x1="80"
       y1="140"
       x2="390"
       y2="140"
       stroke="#888780"
       stroke-width="0.5"
       id="line27" />
    <line
       x1="80"
       y1="200"
       x2="390"
       y2="200"
       stroke="#888780"
       stroke-width="0.5"
       id="line29" />
    <line
       x1="80"
       y1="260"
       x2="390"
       y2="260"
       stroke="#888780"
       stroke-width="0.5"
       id="line31" />
  </g>
  <!-- Axes -->
  <line
     x1="80"
     y1="260"
     x2="390"
     y2="260"
     stroke="#888780"
     stroke-width="1"
     marker-end="url(#arrow)"
     id="line35" />
  <line
     x1="80"
     y1="290"
     x2="80"
     y2="60"
     stroke="#888780"
     stroke-width="1"
     marker-end="url(#arrow)"
     id="line37" />
  <text
     class="ts"
     x="395"
     y="264"
     id="text39">x</text>
  <text
     class="ts"
     x="72"
     y="58"
     text-anchor="middle"
     id="text41">y</text>
  <!-- Graduations axes -->
  <text
     class="ts"
     x="80"
     y="276"
     text-anchor="middle"
     id="text43">0</text>
  <text
     class="ts"
     x="140"
     y="276"
     text-anchor="middle"
     id="text45">1</text>
  <text
     class="ts"
     x="200"
     y="276"
     text-anchor="middle"
     id="text47">2</text>
  <text
     class="ts"
     x="260"
     y="276"
     text-anchor="middle"
     id="text49">3</text>
  <text
     class="ts"
     x="68"
     y="264"
     text-anchor="middle"
     id="text51">0</text>
  <text
     class="ts"
     x="68"
     y="204"
     text-anchor="middle"
     id="text53">1</text>
  <text
     class="ts"
     x="68"
     y="144"
     text-anchor="middle"
     id="text55">2</text>
  <!-- Segment p->o (teal) -->
  <line
     x1="80"
     y1="260"
     x2="200"
     y2="200"
     stroke="#1D9E75"
     stroke-width="2.5"
     stroke-linecap="round"
     id="line57" />
  <!-- Segment o->q (teal, tirets) -->
  <line
     x1="200"
     y1="200"
     x2="260"
     y2="260"
     stroke="#1D9E75"
     stroke-width="2.5"
     stroke-linecap="round"
     stroke-dasharray="6 3"
     id="line59" />
  <!-- Segment p->q (coral, chemin direct) -->
  <line
     x1="80"
     y1="260"
     x2="260"
     y2="260"
     stroke="#D85A30"
     stroke-width="3"
     stroke-linecap="round"
     id="line61" />
  <!-- Points -->
  <circle
     cx="80"
     cy="260"
     r="7"
     fill="#3C3489"
     id="circle63" />
  <circle
     cx="200"
     cy="200"
     r="7"
     fill="#1D9E75"
     id="circle65" />
  <circle
     cx="260"
     cy="260"
     r="7"
     fill="#D85A30"
     id="circle67" />
  <!-- Étiquettes points -->
  <text
     class="th"
     x="72"
     y="250"
     text-anchor="end"
     fill="#3C3489"
     id="text69">p (0,0)</text>
  <text
     class="th"
     x="210"
     y="192"
     text-anchor="start"
     fill="#0F6E56"
     id="text71">o (2,1)</text>
  <text
     class="th"
     x="268"
     y="250"
     text-anchor="start"
     fill="#993C1D"
     id="text73">q (3,0)</text>
  <!-- Annotations distances sur segments -->
  <text
     class="ts"
     x="128"
     y="218"
     text-anchor="middle"
     fill="#0F6E56"
     id="text75">√5 ≈ 2.24</text>
  <text
     class="ts"
     x="128"
     y="230"
     text-anchor="middle"
     fill="#0F6E56"
     id="text77">(d²=5)</text>
  <text
     class="ts"
     x="232"
     y="245"
     text-anchor="middle"
     fill="#0F6E56"
     id="text79">√2 ≈ 1.41</text>
  <text
     class="ts"
     x="232"
     y="257"
     text-anchor="middle"
     fill="#0F6E56"
     id="text81">(d²=2)</text>
  <text
     class="ts"
     x="170"
     y="278"
     text-anchor="middle"
     fill="#993C1D"
     id="text83">3  (d²=9)</text>
  <!-- Panneau teal : chemin détour -->
  <rect
     x="420"
     y="70"
     width="230"
     height="56"
     rx="8"
     fill="#E1F5EE"
     stroke="#1D9E75"
     stroke-width="0.8"
     id="rect85" />
  <text
     class="th"
     x="535"
     y="94"
     text-anchor="middle"
     fill="#085041"
     id="text87">Via o —2-steptspath</text>
  <text
     class="ts"
     x="535"
     y="112"
     text-anchor="middle"
     fill="#0F6E56"
     id="text89">d²E(p,o) + d²E(o,q) = 5 + 2 = 7</text>
  <!-- Panneau coral : chemin direct -->
  <rect
     x="420"
     y="146"
     width="230"
     height="56"
     rx="8"
     fill="#FAECE7"
     stroke="#D85A30"
     stroke-width="0.8"
     id="rect91" />
  <text
     class="th"
     x="535"
     y="170"
     text-anchor="middle"
     fill="#4A1B0C"
     id="text93">Direct p → q</text>
  <text
     class="ts"
     x="535"
     y="188"
     text-anchor="middle"
     fill="#993C1D"
     id="text95">d²E(p,q) = 3² + 0² = 9</text>
  <!-- Panneau résultat -->
  <rect
     x="420"
     y="222"
     width="230"
     height="66"
     rx="8"
     fill="#FCEBEB"
     stroke="#E24B4A"
     stroke-width="1"
     id="rect97" />
  <text
     x="535"
     y="248"
     text-anchor="middle"
     font-family="Arial,Helvetica,sans-serif"
     font-size="15"
     font-weight="700"
     fill="#A32D2D"
     id="text99">9 &gt; 7</text>
  <text
     class="ts"
     x="535"
     y="268"
     text-anchor="middle"
     fill="#791F1F"
     id="text101">The shortest path</text>
  <text
     class="ts"
     x="535"
     y="282"
     text-anchor="middle"
     fill="#791F1F"
     id="text103">is NOT thestraightpath!</text>
  <!-- Légende -->
  <line
     x1="420"
     y1="318"
     x2="460"
     y2="318"
     stroke="#1D9E75"
     stroke-width="2.5"
     stroke-linecap="round"
     id="line105" />
  <text
     class="ts"
     x="468"
     y="322"
     fill="#0F6E56"
     id="text107">path via o (détour)</text>
  <line
     x1="420"
     y1="343"
     x2="460"
     y2="343"
     stroke="#D85A30"
     stroke-width="3"
     stroke-linecap="round"
     id="line109" />
  <text
     class="ts"
     x="468"
     y="347"
     fill="#993C1D"
     id="text111">direct path p → q</text>
